name: Build PSP EBOOT

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          make clean
          make

      - name: Package PSP folder
        run: |
          test -s EBOOT.PBP
          mkdir -p dist/PSP/GAME/NarutoStorm4/assets/chr
          mkdir -p dist/PSP/GAME/NarutoStorm4/assets/stg
          mkdir -p dist/PSP/GAME/NarutoStorm4/assets/ui
          cp EBOOT.PBP dist/PSP/GAME/NarutoStorm4/EBOOT.PBP
          cp -R assets/chr/. dist/PSP/GAME/NarutoStorm4/assets/chr/
          cp -R assets/stg/. dist/PSP/GAME/NarutoStorm4/assets/stg/
          cp -R assets/ui/. dist/PSP/GAME/NarutoStorm4/assets/ui/
          cd dist && zip -r NarutoStorm4-PSP.zip PSP
          ls -lh PSP/GAME/NarutoStorm4/EBOOT.PBP NarutoStorm4-PSP.zip

      - name: Upload installable PSP folder (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NarutoStorm4-PSP
          path: dist/NarutoStorm4-PSP.zip

      - name: Upload EBOOT.PBP (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT.PBP
          path: EBOOT.PBP

      - name: Publish release (download installable ZIP and EBOOT.PBP)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          body: |
            Installable PSP folder: extract NarutoStorm4-PSP.zip and copy its PSP folder to the root of your PSP memory stick or PPSSPP memory stick directory.
            EBOOT.PBP is also provided separately.
            Untested prototype build; test in PPSSPP before treating gameplay as verified.
          prerelease: true
          files: |
            EBOOT.PBP
            dist/NarutoStorm4-PSP.zip

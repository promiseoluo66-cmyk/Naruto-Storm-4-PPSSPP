name: Build PSP EBOOT

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python (model asset tools)
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache python3
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y python3
            else
              echo "python3 is missing and no supported package manager was found" >&2
              exit 1
            fi
          fi
          python3 --version

      - name: Inspect uploaded Naruto model archive (read-only)
        run: |
          python3 - <<'PY'
          import io, zipfile
          from pathlib import PurePosixPath

          outer_path = "assets/chr/test/naruto-shippuden-naruto.zip"
          with zipfile.ZipFile(outer_path) as outer:
              nested_names = [n for n in outer.namelist() if n.lower().endswith(".zip")]
              if not nested_names:
                  raise SystemExit("No nested ZIP found in uploaded archive")
              nested_name = nested_names[0]
              print("NESTED ARCHIVE:", nested_name)
              with zipfile.ZipFile(io.BytesIO(outer.read(nested_name))) as inner:
                  names = inner.namelist()
                  print("MODEL FILES:")
                  for n in names:
                      low = n.lower()
                      if low.endswith((".obj", ".mtl", ".smd")):
                          print(" ", n, inner.getinfo(n).file_size, "bytes")

                  obj_name = next((n for n in names if n.endswith("/Naruto.obj")), None)
                  mtl_name = next((n for n in names if n.endswith("/Naruto.mtl")), None)
                  smd_name = next((n for n in names if n.endswith("/Naruto.smd")), None)

                  if obj_name:
                      verts, uvs, norms, faces, triangles, materials = 0, 0, 0, 0, 0, []
                      mins = [float("inf")] * 3
                      maxs = [float("-inf")] * 3
                      for raw in inner.read(obj_name).decode("utf-8", "replace").splitlines():
                          p = raw.strip().split()
                          if not p:
                              continue
                          if p[0] == "v" and len(p) >= 4:
                              verts += 1
                              xyz = [float(x) for x in p[1:4]]
                              for i, x in enumerate(xyz):
                                  mins[i] = min(mins[i], x)
                                  maxs[i] = max(maxs[i], x)
                          elif p[0] == "vt":
                              uvs += 1
                          elif p[0] == "vn":
                              norms += 1
                          elif p[0] == "f":
                              faces += 1
                              triangles += max(0, len(p) - 3)
                          elif p[0] == "usemtl" and len(p) > 1 and p[1] not in materials:
                              materials.append(p[1])
                      print("OBJ:", obj_name, "vertices=", verts, "uvs=", uvs,
                            "normals=", norms, "faces=", faces, "triangles_after_triangulation=", triangles)
                      if verts:
                          print("OBJ BOUNDS min=", mins, "max=", maxs)
                      print("OBJ MATERIAL SLOTS:", materials)
                  if mtl_name:
                      print("MTL REFERENCES:")
                      for raw in inner.read(mtl_name).decode("utf-8", "replace").splitlines():
                          p = raw.strip().split()
                          if p and p[0] in ("newmtl", "map_Kd", "Kd"):
                              print(" ", raw.strip())
                  if smd_name:
                      smd = inner.read(smd_name).decode("utf-8", "replace").splitlines()
                      nodes = [x.strip() for x in smd if x.strip().startswith("nodes")]
                      skeleton = [x.strip() for x in smd if x.strip().startswith("skeleton")]
                      triangles_at = next((i for i,x in enumerate(smd) if x.strip() == "triangles"), None)
                      node_lines = []
                      in_nodes = False
                      for x in smd:
                          if x.strip() == "nodes":
                              in_nodes = True
                              continue
                          if in_nodes and x.strip() == "end":
                              break
                          if in_nodes and x.strip():
                              node_lines.append(x.strip())
                      tri_count = 0
                      if triangles_at is not None:
                          i = triangles_at + 1
                          while i < len(smd) and smd[i].strip() != "end":
                              material = smd[i].strip()
                              if not material:
                                  i += 1
                                  continue
                              tri_count += 1
                              i += 4
                      print("SMD:", smd_name, "lines=", len(smd),
                            "nodes_sections=", len(nodes), "skeleton_sections=", len(skeleton),
                            "bone_nodes=", len(node_lines), "triangle_records=", tri_count)
                      print("SMD FIRST BONE NODES:", node_lines[:16])
          PY

      - name: Prepare imported OBJ and inspect texture inputs (temporary only)
        run: |
          python3 - <<'PY'
          import io, zipfile, struct
          outer_path = "assets/chr/test/naruto-shippuden-naruto.zip"
          with zipfile.ZipFile(outer_path) as outer:
              nested = next((n for n in outer.namelist() if n.lower().endswith(".zip")), None)
              if not nested: raise SystemExit("Nested model archive not found")
              with zipfile.ZipFile(io.BytesIO(outer.read(nested))) as inner:
                  names = inner.namelist()
                  print("INNER ARCHIVE EXTRACTED IN MEMORY — no model files copied into build/release")
                  for name in names:
                      low = name.lower()
                      if low.endswith(".png"):
                          data = inner.read(name)
                          dims = "unknown dimensions"
                          if data[:8] == bytes([137,80,78,71,13,10,26,10]) and len(data) >= 24:
                              w, h = struct.unpack(">II", data[16:24])
                              dims = "%dx%d" % (w, h)
                          print("TEXTURE:", name, "bytes=", len(data), "dimensions=", dims)
                  obj = next((n for n in names if n.endswith("/Naruto.obj")), None)
                  mtl = next((n for n in names if n.endswith("/Naruto.mtl")), None)
                  if not obj or not mtl: raise SystemExit("Expected Naruto OBJ/MTL missing")
                  obj_text = inner.read(obj).decode("utf-8", "replace")
                  counts = {"v":0, "vt":0, "vn":0, "f":0}
                  used = []
                  for raw in obj_text.splitlines():
                      p = raw.strip().split()
                      if not p: continue
                      if p[0] in counts: counts[p[0]] += 1
                      if p[0] == "usemtl" and len(p) > 1 and p[1] not in used: used.append(p[1])
                  print("OBJ:", obj, counts)
                  print("OBJ MATERIAL SLOTS:", used)
                  print("MTL TEXTURE REFERENCES:")
                  for raw in inner.read(mtl).decode("utf-8", "replace").splitlines():
                      p = raw.strip().split()
                      if p and p[0] in ("newmtl", "map_Kd", "Kd"): print(" ", raw.strip())
          PY
      - name: Install Pillow and convert imported character
        run: |
          if ! python3 -m pip --version >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache py3-pip
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y python3-pip
            fi
          fi
          python3 -m pip install --break-system-packages Pillow || python3 -m pip install --user Pillow
          python3 tools/import_obj_zip.py assets/chr/test/naruto-shippuden-naruto.zip assets/chr/test/naruto_import
          python3 tools/import_smd_zip.py assets/chr/test/naruto-shippuden-naruto.zip assets/chr/test/naruto_rigged
      - name: Build
        run: |
          make clean
          make

      - name: Install ZIP utility
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache zip
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y zip
          else
            echo "No supported package manager found to install zip" >&2
            exit 1
          fi

      - name: Package PSP folder
        run: |
          test -s EBOOT.PBP
          mkdir -p dist/PSP/GAME/NarutoStorm4
          cp EBOOT.PBP dist/PSP/GAME/NarutoStorm4/EBOOT.PBP
          mkdir -p dist/PSP/GAME/NarutoStorm4/assets
          cp -R assets/. dist/PSP/GAME/NarutoStorm4/assets/
          # Leave the input archive in the repository, not in the game installer.
          rm -f dist/PSP/GAME/NarutoStorm4/assets/chr/test/naruto-shippuden-naruto.zip
          if [ -d data ]; then
            mkdir -p dist/PSP/GAME/NarutoStorm4/data
            cp -R data/. dist/PSP/GAME/NarutoStorm4/data/
          fi
          cd dist && zip -r NarutoStorm4-PSP.zip PSP
          ls -lh PSP/GAME/NarutoStorm4/EBOOT.PBP NarutoStorm4-PSP.zip

      - name: Upload installable PSP folder (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NarutoStorm4-PSP
          path: dist/NarutoStorm4-PSP.zip

      - name: Upload EBOOT.PBP (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT.PBP
          path: EBOOT.PBP

      - name: Publish release (download installable ZIP and EBOOT.PBP)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          body: |
            Installable PSP folder: extract NarutoStorm4-PSP.zip and copy its PSP folder to the root of your PSP memory stick or PPSSPP memory stick directory.
            EBOOT.PBP is also provided separately.
            This build opens the Free Battle menu. Naruto uses an imported weighted SMD mesh with a procedural analog-driven walk cycle; other fighters remain prototype models. Story Mode is disabled in this build. Runtime testing in PPSSPP is still required. The source ZIP is not included in the installer.
          prerelease: true
          files: |
            EBOOT.PBP
            dist/NarutoStorm4-PSP.zip

name: Build PSP EBOOT

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python (model asset tools)
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache python3
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y python3
            else
              echo "python3 is missing and no supported package manager was found" >&2
              exit 1
            fi
          fi
          python3 --version

      - name: Build
        run: |
          make clean
          make

      - name: Install ZIP utility
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache zip
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y zip
          else
            echo "No supported package manager found to install zip" >&2
            exit 1
          fi

      - name: Package PSP folder
        run: |
          test -s EBOOT.PBP
          mkdir -p dist/PSP/GAME/NarutoStorm4
          cp EBOOT.PBP dist/PSP/GAME/NarutoStorm4/EBOOT.PBP
          mkdir -p dist/PSP/GAME/NarutoStorm4/assets
          cp -R assets/. dist/PSP/GAME/NarutoStorm4/assets/
          if [ -d data ]; then
            mkdir -p dist/PSP/GAME/NarutoStorm4/data
            cp -R data/. dist/PSP/GAME/NarutoStorm4/data/
          fi
          cd dist && zip -r NarutoStorm4-PSP.zip PSP
          ls -lh PSP/GAME/NarutoStorm4/EBOOT.PBP NarutoStorm4-PSP.zip

      - name: Upload installable PSP folder (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: NarutoStorm4-PSP
          path: dist/NarutoStorm4-PSP.zip

      - name: Upload EBOOT.PBP (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT.PBP
          path: EBOOT.PBP

      - name: Publish release (download installable ZIP and EBOOT.PBP)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          body: |
            Installable PSP folder: extract NarutoStorm4-PSP.zip and copy its PSP folder to the root of your PSP memory stick or PPSSPP memory stick directory.
            EBOOT.PBP is also provided separately.
            This build starts with a MODEL TEST screen (original test character); press X to continue to the game.
            Untested prototype build; test in PPSSPP before treating gameplay as verified.
          prerelease: true
          files: |
            EBOOT.PBP
            dist/NarutoStorm4-PSP.zip

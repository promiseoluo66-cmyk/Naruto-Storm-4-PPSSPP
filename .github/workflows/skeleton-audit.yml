name: Naruto SMD rig audit

on:
  push:
    branches: [rig-audit-only]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-validate:
    # The workflow's own generated-output push must not trigger an endless loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: rig-audit-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract and validate original SMD rig
        run: python tools/audit_smd_rig.py

      - name: Upload raw audit files
        uses: actions/upload-artifact@v4
        with:
          name: naruto-smd-rig-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated audit outputs to this isolated branch
        run: |
          if git status --porcelain audit-output/ | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audit-output/
            git commit -m "Add extracted Naruto SMD rig audit outputs"
            git push origin HEAD:rig-audit-only
          else
            echo "No generated audit changes."
          fi

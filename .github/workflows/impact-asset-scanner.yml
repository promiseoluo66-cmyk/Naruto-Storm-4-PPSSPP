name: Impact asset scanner tests

on:
  push:
    branches: [impact-asset-inventory]
    paths:
      - "tools/impact-assets/**"
      - ".github/workflows/impact-asset-scanner.yml"
  pull_request:
    paths:
      - "tools/impact-assets/**"
      - ".github/workflows/impact-asset-scanner.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner unit tests
        run: python -m unittest discover -s tools/impact-assets/tests -v
